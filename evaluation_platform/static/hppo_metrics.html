<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H-PPO 运行指标评估</title>
  <style>
    :root{--bg:#071016;--panel:#0c1921;--panel2:#10212a;--line:#203640;--text:#dce8ec;--muted:#82949d;--cyan:#55d7e7;--green:#69d5a1;--amber:#edc56d;--red:#ef7e78}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071016;color:var(--text);font-family:Bahnschrift,"Microsoft YaHei",sans-serif;background-image:linear-gradient(rgba(96,139,151,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(96,139,151,.04) 1px,transparent 1px);background-size:32px 32px}button,select{font:inherit;color:inherit}.top{height:64px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(6,15,21,.94)}h1{margin:0;font-size:17px;letter-spacing:.06em}.top small{color:var(--muted);margin-left:16px}.back{border:1px solid var(--line);background:#0d1c24;padding:7px 12px;font-size:11px;cursor:pointer}.wrap{max-width:1420px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:1px solid var(--line);background:var(--panel);padding:11px 16px;cursor:pointer;font-size:12px}.tab.active{border-color:var(--cyan);color:var(--cyan);background:rgba(85,215,231,.08)}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--cyan)}h2{font-size:24px;margin:7px 0}p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}.control{display:grid;grid-template-columns:minmax(320px,1fr) 120px;gap:8px;min-width:440px}.control select,.control button{height:38px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font-size:11px}.control button{background:var(--cyan);border-color:var(--cyan);color:#061318;font-weight:700;cursor:pointer}.status{font-size:11px;color:var(--muted);margin:10px 0 18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}.card,.panel{border:1px solid var(--line);background:rgba(12,25,33,.94);border-radius:4px}.card{padding:15px}.card label{font-size:10px;color:var(--muted)}.value{font-size:30px;margin:9px 0;color:#eff9fb}.card small{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.panelhead{padding:13px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}.panelbody{max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:9px;border-bottom:1px solid rgba(32,54,64,.75);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#0d1d25;color:var(--muted);font-weight:500}.ok{color:var(--green)}.bad{color:var(--red)}.na{color:var(--amber)}.note{padding:14px;font-size:11px;color:var(--muted);line-height:1.65}.summary{padding:14px}.summary div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(32,54,64,.65);font-size:11px}.summary span{color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d1d25;border:1px solid var(--line);padding:10px 14px;font-size:11px;display:none}.toast.show{display:block}@media(max-width:900px){.hero{display:block}.control{min-width:0;margin-top:16px}.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards,.grid,.control{grid-template-columns:1fr}.wrap{padding:14px}.top{padding:0 14px}}
  #historicalProxyBtn{height:38px;border:1px solid var(--amber);background:rgba(237,197,109,.12);color:var(--amber);padding:0 10px;font-size:11px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<header class="top"><div><h1>智能空管指标评估平台 <small>H-PPO OFFLINE METRICS</small></h1></div><button class="back" onclick="location.href='index.html'">返回指标库</button></header>
<main class="wrap">
  <div class="tabs"><button class="tab" data-metric="dynamic_separation_adjustment">动态间隔调整成功率</button><button class="tab" data-metric="command_execution_acceptance">管制指令执行接口接受度</button><button class="tab" data-metric="command_acceptability_proxy">自动化离线指令可接受性</button><button class="tab" data-metric="autonomous_command_response_time">自主生成响应时间</button></div>
  <section class="hero"><div><span class="eyebrow" id="group">SEPARATION MANAGEMENT</span><h2 id="title">动态间隔调整成功率</h2><p id="subtitle">评估运行中调整水平间隔后，相关回合是否安全结束。</p></div><div class="control"><select id="sourceRun"><option value="">正在加载 H-PPO 运行目录...</option></select><button id="runBtn">开始离线评估</button></div></section>
  <div class="status" id="status">正在连接评估服务...</div>
  <section class="cards"><article class="card"><label id="primaryLabel">主指标</label><div class="value" id="primaryValue">待计算</div><small id="primaryNote">选择运行目录后进行离线评分</small></article><article class="card"><label id="secondaryLabel">有效事件</label><div class="value" id="secondaryValue">—</div><small id="secondaryNote">—</small></article><article class="card"><label id="thirdLabel">成功事件</label><div class="value" id="thirdValue">—</div><small id="thirdNote">—</small></article><article class="card"><label id="fourthLabel">失败或拒绝</label><div class="value" id="fourthValue">—</div><small id="fourthNote">—</small></article></section>
  <section class="grid"><article class="panel"><div class="panelhead" id="detailTitle">调整事件明细</div><div class="panelbody"><table><thead id="tableHead"></thead><tbody id="detailRows"><tr><td>完成评估后展示日志证据。</td></tr></tbody></table></div></article><aside class="panel"><div class="panelhead">评分口径与适用边界</div><div class="summary" id="summary"><div><span>评分状态</span><b>待计算</b></div></div><div class="note" id="boundary">初版指标仅基于已落盘 H-PPO 日志，不修改模型、仿真或训练结果。</div></aside></section>
</main><div class="toast" id="toast"></div>
<script>
const API=location.protocol==='file:'?'http://127.0.0.1:8765':'';
const definitions={
  dynamic_separation_adjustment:{group:'SEPARATION MANAGEMENT',title:'动态间隔调整成功率',subtitle:'评估运行中调整水平间隔后，是否在截止时间内稳定满足新标准。',primary:'动态间隔调整成功率',format:'percent',cards:['有效调整事件','稳定达标事件','未完成事件'],detail:'间隔调整事件明细',columns:['回合','变更时刻','原间隔','新间隔','类型','结果','原因'],boundary:'正式结果要求配置生效、稳定确认窗口达标且无记录的次生冲突；历史日志仅显示 episode 级代理结果。'},
  command_execution_acceptance:{group:'COMMAND EXECUTION',title:'管制指令执行接口接受度',subtitle:'评估 BlueSky 对已提交 H-PPO 管制指令的接口接受情况。',primary:'管制指令执行接口接受度',format:'percent',cards:['实际提交指令','成功接受指令','被拒绝指令'],detail:'管制指令执行明细',columns:['回合','仿真时刻','航空器','指令类型','指令文本','结果','原因'],boundary:'该指标仅衡量仿真中 BlueSky 对实际提交指令的接口接受情况，不表示真实飞行员、机组或管制员的人因接受度。'},
  command_acceptability_proxy:{group:'COMMAND QUALITY / OFFLINE PROXY',title:'自动化离线管制指令可接受性',subtitle:'使用硬约束、短时风险变化、回合安全结果和稳定性证据进行离线代理评分。',primary:'自动离线接受率',format:'percent',cards:['有效评估指令','条件接受指令','硬拒绝指令'],detail:'自动化离线可接受性明细',columns:['回合','仿真时刻','航空器','动作类型','指令文本','评分','结果','原因'],boundary:'该指标是自动化离线可接受性代理评分，不等同于真实管制员、飞行员或机组的人因接受度。'},
  autonomous_command_response_time:{group:'DECISION RESPONSE / EXTENSION',title:'管制指令自主生成响应时间',subtitle:'统计冲突状态形成后，H-PPO 完成决策、参数化和指令调用的本地处理耗时。',primary:'加权平均响应时间',format:'duration',cards:['响应时间样本','最大响应时间','样本覆盖率'],detail:'逐回合响应时间证据',columns:['回合','场景','样本数','平均耗时','最大耗时','决策次数','应用指令数'],boundary:'计时从已形成的冲突状态进入决策步骤开始，不包含冲突检测、离线 LLM 生成、调度等待和航空器执行过程。'}
};
let metric=new URLSearchParams(location.search).get('metric')||'dynamic_separation_adjustment';if(!definitions[metric])metric='dynamic_separation_adjustment';
const $=id=>document.getElementById(id);const pct=v=>v==null?'暂无数据':(Number(v)*100).toFixed(1)+'%';const ms=v=>v==null?'暂无数据':Number(v).toFixed(2)+' ms';
const esc=v=>String(v??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function requiresDiagnostics(){return !['dynamic_separation_adjustment','command_execution_acceptance','command_acceptability_proxy'].includes(metric)}
function updateAvailability(){const option=$('sourceRun').selectedOptions[0];const ready=!!option?.value&&(!requiresDiagnostics()||option.dataset.hasDiagnostics==='true');$('runBtn').disabled=!ready;if(option?.value&&requiresDiagnostics()&&!ready)$('status').textContent='当前指标需要 validation_diagnostics.csv 或 training_diagnostics.csv。'}
function applyDefinition(){const d=definitions[metric];document.title=d.title+' · 智能空管指标评估平台';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.metric===metric));$('group').textContent=d.group;$('title').textContent=d.title;$('subtitle').textContent=d.subtitle;$('primaryLabel').textContent=d.primary;$('secondaryLabel').textContent=d.cards[0];$('thirdLabel').textContent=d.cards[1];$('fourthLabel').textContent=d.cards[2];$('detailTitle').textContent=d.detail;$('tableHead').innerHTML='<tr>'+d.columns.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>';$('detailRows').innerHTML='<tr><td colspan="7">完成评估后展示日志证据。</td></tr>';$('primaryValue').textContent='待计算';['secondary','third','fourth'].forEach(x=>$(x+'Value').textContent='—');$('summary').innerHTML='<div><span>评分状态</span><b>待计算</b></div>';$('boundary').textContent=d.boundary;updateAvailability()}
async function api(path,options={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.message||'HTTP '+r.status);return d}
async function loadRuns(){try{const d=await api('/api/hppo/runs');const items=d.items||[];$('sourceRun').innerHTML=items.length?items.map(x=>`<option value="${esc(x.path)}" data-has-diagnostics="${x.has_diagnostics}">${esc(x.name)}${x.has_diagnostics==='true'?'':' · 缺少诊断文件'}</option>`).join(''):'<option value="">未发现含 events.jsonl 的 H-PPO 运行目录</option>';$('status').textContent=items.length?`评估服务就绪，发现 ${items.length} 个可审计 H-PPO 运行目录。`:'未发现可评估的 H-PPO 事件日志。';updateAvailability()}catch(e){$('status').textContent='评估服务未连接。请运行 start_evaluation_platform.cmd。';$('runBtn').disabled=true}}
function render(data,runId){const c=data.counts||{},m=data.metrics||{},d=definitions[metric];$('primaryValue').textContent=d.format==='duration'?ms(data.primary?.value):pct(data.primary?.value);$('primaryNote').textContent=runId;$('boundary').textContent=data.claim_boundary||$('boundary').textContent;$('summary').innerHTML=`<div><span>评分状态</span><b class="${data.status==='complete'?'ok':'na'}">${data.status==='complete'?'已完成':'暂无可评估事件'}</b></div>`;
  if(metric==='dynamic_separation_adjustment'){const formal=Number(c.formal_eligible_events||0)>0;$('secondaryValue').textContent=formal?(c.formal_eligible_events??0):(c.eligible_events??0);$('secondaryNote').textContent=formal?'正式有效调整事件':'历史日志代理事件';$('thirdValue').textContent=formal?(c.formal_successful_events??0):(c.successful_events??0);$('thirdNote').textContent=formal?'稳定确认窗口达标':'回合安全完成代理';$('fourthValue').textContent=formal?(m.mean_response_time_s==null?'—':Number(m.mean_response_time_s).toFixed(1)):Math.max(0,(c.eligible_events||0)-(c.successful_events||0));$('fourthNote').textContent=formal?'平均达标时间（s）':'代理未完成事件';$('detailRows').innerHTML=(data.details||[]).map(r=>`<tr><td>${esc(r.episode)}</td><td>${Number(r.sim_time_s||0).toFixed(1)} s</td><td>${Number(r.old_horizontal_nm||0).toFixed(2)} NM</td><td>${Number(r.new_horizontal_nm||0).toFixed(2)} NM</td><td>${esc(r.change_type)}</td><td class="${r.success?'ok':r.eligible?'bad':'na'}">${r.success?'成功':r.eligible?'失败':'不适用'}</td><td>${esc(r.reason)}</td></tr>`).join('')||'<tr><td colspan="7">当前运行没有可评分的间隔调整事件。</td></tr>'}
  else if(metric==='command_acceptability_proxy'){$('secondaryValue').textContent=c.eligible_commands??0;$('secondaryNote').textContent='有效评估指令';$('thirdValue').textContent=c.conditional_commands??0;$('thirdNote').textContent='条件接受';$('fourthValue').textContent=c.rejected_commands??0;$('fourthNote').textContent='硬拒绝或低分';$('detailRows').innerHTML=(data.details||[]).map(r=>`<tr><td>${esc(r.episode)}</td><td>${Number(r.sim_time_s||0).toFixed(1)} s</td><td>${esc(r.aircraft_id)}</td><td>${esc(r.macro_name)}</td><td>${esc(r.command)}</td><td>${Number(r.score||0).toFixed(3)}</td><td class="${r.accepted?'ok':r.conditional?'na':'bad'}">${r.accepted?'接受':r.conditional?'条件接受':'拒绝'}</td><td>${esc(r.reason)}</td></tr>`).join('')||'<tr><td colspan="8">当前运行没有可评分的有效指令。</td></tr>'}
  else if(metric==='command_execution_acceptance'){$('secondaryValue').textContent=c.submitted??0;$('secondaryNote').textContent='实际提交';$('thirdValue').textContent=c.accepted??0;$('thirdNote').textContent='成功接受';$('fourthValue').textContent=c.rejected??0;$('fourthNote').textContent='接口拒绝';$('detailRows').innerHTML=(data.details||[]).map(r=>`<tr><td>${esc(r.episode)}</td><td>${Number(r.sim_time_s||0).toFixed(1)} s</td><td>${esc(r.aircraft_id)}</td><td>${esc(r.macro_name)}</td><td>${esc(r.command)}</td><td class="${r.accepted?'ok':'bad'}">${r.accepted?'接受':'拒绝'}</td><td>${esc(r.reason)}</td></tr>`).join('')||'<tr><td colspan="7">当前运行没有可评分的实际提交指令。</td></tr>'}
  else{$('secondaryValue').textContent=c.response_samples??0;$('secondaryNote').textContent=`${c.evaluable_episodes??0} 个可评估回合`;$('thirdValue').textContent=ms(m.max_decision_response_ms);$('thirdNote').textContent='全部回合最大值';$('fourthValue').textContent=pct(m.response_sample_coverage);$('fourthNote').textContent=`${c.response_samples??0} / ${c.decision_count??0} 次决策`;$('summary').innerHTML+=`<div><span>优化方向</span><b>越低越好</b></div><div><span>应用指令数</span><b>${c.command_executions??0}</b></div>`;$('detailRows').innerHTML=(data.details||[]).map(r=>`<tr><td>${esc(r.episode)}</td><td>${esc(r.scenario)}</td><td>${r.samples??0}</td><td>${ms(r.mean_ms)}</td><td>${ms(r.max_ms)}</td><td>${r.decision_count??0}</td><td>${r.command_executions??0}</td></tr>`).join('')||'<tr><td colspan="7">当前诊断文件没有响应时间样本。</td></tr>'}}
async function start(){try{$('runBtn').disabled=true;$('runBtn').textContent='评分中...';const state=await api('/api/runs',{method:'POST',body:JSON.stringify({metric_id:metric,source_run:$('sourceRun').value})});poll(state.run_id)}catch(e){toast(e.message);$('runBtn').disabled=false;$('runBtn').textContent='开始离线评估'}}
async function poll(runId){try{const s=await api('/api/runs/'+runId);$('status').textContent=`${s.message} · ${s.progress}%`;if(s.status==='complete'){render(await api('/api/runs/'+runId+'/result'),runId);$('runBtn').disabled=false;$('runBtn').textContent='开始离线评估';toast('评估完成，已加载真实日志结果。');return}if(s.status==='failed')throw new Error(s.error||s.message);setTimeout(()=>poll(runId),500)}catch(e){toast(e.message);$('runBtn').disabled=false;$('runBtn').textContent='开始离线评估'}}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{metric=x.dataset.metric;history.replaceState(null,'','?metric='+metric);applyDefinition()});$('sourceRun').onchange=updateAvailability;$('runBtn').onclick=start;applyDefinition();loadRuns();
</script></body></html>
